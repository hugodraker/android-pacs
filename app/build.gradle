plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hugo.risserver'
    compileSdk 34

    defaultConfig {
        applicationId "com.hugo.risserver"
        minSdk 9      // Android 2.3 Gingerbread
        targetSdk 10  // Android 2.3.3
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}